<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>Conceptual model of the Social TV study (dark mode)</title><desc>Viewing condition and ad modality predict ad effectiveness. Viewing condition also predicts gratification and flow as mediators.</desc><defs><marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#e5e7eb" stroke-width="1.5"/></marker></defs><g fill="none" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#arrow-dark)"><path d="M210 165L470 205"/><path d="M210 150L250 60"/><path d="M210 175L250 245"/><path d="M125 330V300H550V229"/><path d="M440 70L470 195"/><path d="M440 245L470 215"/></g><g font-size="12" font-weight="600" fill="#4dabf7"><text x="400" y="155">H1, H2</text><text x="455" y="95">H3</text><text x="455" y="262">H4</text></g><g fill="none" stroke="#e5e7eb" stroke-width="1.25"><rect x="40" y="140" width="170" height="44" rx="6"/><rect x="40" y="330" width="170" height="44" rx="6"/><rect x="250" y="20" width="190" height="56" rx="6"/><rect x="250" y="230" width="190" height="44" rx="6"/></g><g font-size="13" fill="#f3f4f6" text-anchor="middle"><text x="125" y="166">Viewing condition</text><text x="125" y="356">Ad modality</text><text x="345" y="43">Gratification of</text><text x="345" y="63">social TV usage</text><text x="345" y="256">Flow experience</text></g><rect x="470" y="185" width="160" height="44" rx="6" fill="rgba(0,123,255,.15)" stroke="#4dabf7" stroke-width="1.5"/><text x="550" y="211" font-size="13" font-weight="600" fill="#9ecbff" text-anchor="middle">Ad effectiveness</text></svg>
